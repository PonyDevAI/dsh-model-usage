name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $TAG != package.json $PKG" >&2
            exit 1
          fi

      - name: Syntax + smoke
        run: |
          for f in lib/*.js; do node --check "$f"; done
          node scripts/smoke.mjs
          node scripts/check-i18n.mjs

      # Trusted Publishing（OIDC）：无需 NPM_TOKEN，凭 GitHub Actions 身份直接发布
      - name: Publish to npm (OIDC trusted publisher)
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "$NAME@$VER already published, skipping npm publish"
          else
            npm publish --access public --provenance
          fi

      # Release 正文 = CHANGELOG 当前版本条目（缺失则上一步失败）
      - name: Extract release notes from CHANGELOG
        run: node scripts/release-notes.mjs /tmp/release-notes.md

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release-notes.md
